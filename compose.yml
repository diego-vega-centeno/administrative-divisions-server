services:
  server:
    build:
      context: .
      target: dev
    ports:
      - 3000:3000
    # volumes:
    #   - .:/app
    #   - /app/node_modules
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json
        - action: rebuild
          path: package-lock.json
  db:
    image: postgres:18
    restart: always
    user: postgres
    volumes:
      - db-data:/var/lib/postgresql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    env_file:
      - .env
    expose:
      - 5432
    ports:
      - 5433:5432
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data: